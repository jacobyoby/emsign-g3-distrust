[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emsign-g3-distrust"
version = "0.1.0"
description = "Detect and deny compromised eMudhra/emSign G3 intermediate CAs (Mozilla Bug 2083449)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jacobyoby" }]
keywords = ["security", "tls", "pki", "suricata", "emudhra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
emsign-g3 = "emsign_g3.cli:main"

[project.urls]
Repository = "https://github.com/jacobyoby/emsign-g3-distrust"
"Mozilla Bug" = "https://bugzilla.mozilla.org/show_bug.cgi?id=2083449"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emsign_g3 = ["data/indicators.csv", "data/certs/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
