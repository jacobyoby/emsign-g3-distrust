name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify indicators and PEMs
        run: emsign-g3 export-indicators --verify
      - name: Verify committed SIEM rules
        run: emsign-g3 export-indicators --check-committed-rules
      - name: Ruff
        run: ruff check src tests tools/_ensure_src_path.py
      - name: Pytest
        run: pytest -q

  suricata-livefire:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Suricata
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y suricata
      - name: Live-fire rules test
        run: tools/suricata_livefire_test.sh
