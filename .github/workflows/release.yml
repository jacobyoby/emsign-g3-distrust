name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"
      - name: Test
        run: |
          emsign-g3 export-indicators --verify
          emsign-g3 export-indicators --check-committed-rules
          pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Bundle release artifacts
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          cp indicators.csv release-assets/
          cp tools/emsign-g3-distrust.rules release-assets/
          emsign-g3 export-indicators > release-assets/indicators.json
          emsign-g3 export-indicators --ndjson > release-assets/indicators.ndjson
          tar -czf release-assets/sigma-rules.tar.gz -C rules sigma
          tar -czf release-assets/elastic-kql.tar.gz -C rules elastic
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
